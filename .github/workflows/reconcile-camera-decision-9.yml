name: Reconcile Camera Decision 9

on:
  push:
    branches:
      - docs/reconcile-camera-decision-9

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fold Decision 9 into cumulative camera authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          spec_path = Path('docs/22_GATE1_CAMERA_SPECIFICATION.md')
          add_path = Path('docs/25_GATE1_CAMERA_VERTICAL_SPACE_ADDENDUM.md')

          spec = spec_path.read_text()
          add = add_path.read_text()

          source_heading = '## Camera Decision #9 — vertical-space behavior — LOCKED'
          target_heading = '## 9. Vertical-space behavior — LOCKED'
          if target_heading not in spec:
              start = add.index(source_heading)
              end = add.index('\n---\n\n## Reconciliation note', start)
              section = add[start:end].replace(source_heading, target_heading, 1)
              marker = '\n---\n\n## Remaining Issue #2 owner-review sequence\n'
              if marker not in spec:
                  raise SystemExit('owner-review marker not found in docs/22')
              spec = spec.replace(marker, '\n---\n\n' + section + marker, 1)

          pending = '9. vertical-space behavior — **PENDING OWNER REVIEW**'
          locked = '9. ~~vertical-space behavior~~ — **LOCKED**'
          if pending in spec:
              spec = spec.replace(pending, locked, 1)
          elif locked not in spec:
              raise SystemExit('Decision #9 sequence line not found in expected state')

          spec_path.write_text(spec)

          add = add.replace(
              '**Status:** FINAL OWNER APPROVED  ',
              '**Status:** FINAL OWNER APPROVED / RECONCILED INTO `docs/22`  ',
              1,
          )
          add = add.replace(
              '**Scope:** Camera Decision #9 for Issue #2. This addendum extends the cumulative authority in `docs/22_GATE1_CAMERA_SPECIFICATION.md` until the next reconciliation pass folds it into that file.',
              '**Scope:** Camera Decision #9 provenance record for Issue #2. The cumulative implementation-facing authority now lives in `docs/22_GATE1_CAMERA_SPECIFICATION.md`; this file preserves the decision-specific owner-approved record.',
              1,
          )
          old_note = """## Reconciliation note
`docs/22_GATE1_CAMERA_SPECIFICATION.md` currently contains Decisions #1–#8. This file is canonical authority for Decision #9 until the next reconciliation pass folds this section into `docs/22` and marks item #9 locked there. Do that reconciliation **before** treating Camera Decision #10 as repository-final."""
          new_note = """## Reconciliation note
Decision #9 has been folded into `docs/22_GATE1_CAMERA_SPECIFICATION.md`. `docs/22` is the cumulative implementation-facing camera authority; this addendum remains the owner-approved decision-specific provenance record. The two files must stay semantically consistent."""
          if old_note in add:
              add = add.replace(old_note, new_note, 1)
          elif new_note not in add:
              raise SystemExit('Decision #9 reconciliation note not found in expected state')
          add_path.write_text(add)
          PY

      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "ShiroMaō Studios Automation"
          git config user.email "42227255+raiinman@users.noreply.github.com"
          git add docs/22_GATE1_CAMERA_SPECIFICATION.md docs/25_GATE1_CAMERA_VERTICAL_SPACE_ADDENDUM.md
          if git diff --cached --quiet; then
            echo "No reconciliation changes needed"
            exit 0
          fi
          git commit -m "Docs: reconcile locked vertical-space camera decision"
          git push origin HEAD:docs/reconcile-camera-decision-9
