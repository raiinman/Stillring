name: Reconcile approved camera locks

on:
  push:
    branches:
      - docs/reconcile-camera-locks

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fold Decisions 10 and 11 into cumulative camera authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          spec_path = Path('docs/22_GATE1_CAMERA_SPECIFICATION.md')
          d10_path = Path('docs/26_GATE1_CAMERA_LOCK_ACQUISITION_ADDENDUM.md')
          d11_path = Path('docs/27_GATE1_CAMERA_LOCK_FRAMING_ADDENDUM.md')

          spec = spec_path.read_text()
          d10 = d10_path.read_text()
          d11 = d11_path.read_text()

          marker = '\n---\n\n## Remaining Issue #2 owner-review sequence\n'
          if marker not in spec:
              raise SystemExit('owner-review marker missing in docs/22')

          def extract(add, source_heading, target_heading, end_heading='\n---\n\n## Reconciliation note'):
              start = add.index(source_heading)
              end = add.index(end_heading, start)
              return add[start:end].replace(source_heading, target_heading, 1)

          if '## 10. Lock-on acquisition transition — LOCKED' not in spec:
              section10 = extract(
                  d10,
                  '## Camera Decision #10 — lock-on acquisition transition — LOCKED',
                  '## 10. Lock-on acquisition transition — LOCKED',
              )
              spec = spec.replace(marker, '\n---\n\n' + section10 + marker, 1)

          if '## 11. Lock-on framing distance / offset philosophy — LOCKED' not in spec:
              section11 = extract(
                  d11,
                  '## Camera Decision #11 — lock-on framing distance / offset philosophy — LOCKED',
                  '## 11. Lock-on framing distance / offset philosophy — LOCKED',
              )
              spec = spec.replace(marker, '\n---\n\n' + section11 + marker, 1)

          replacements = {
              '10. lock-on acquisition transition — **PENDING OWNER REVIEW**': '10. ~~lock-on acquisition transition~~ — **LOCKED**',
              '11. lock-on framing distance/offset philosophy — **PENDING OWNER REVIEW**': '11. ~~lock-on framing distance/offset philosophy~~ — **LOCKED**',
          }
          for old, new in replacements.items():
              if old in spec:
                  spec = spec.replace(old, new, 1)
              elif new not in spec:
                  raise SystemExit(f'expected sequence line missing: {old}')

          spec_path.write_text(spec)

          def reconcile_addendum(text, n, scope_old, scope_new, old_note, new_note):
              text = text.replace('**Status:** FINAL OWNER APPROVED  ', '**Status:** FINAL OWNER APPROVED / RECONCILED INTO `docs/22`  ', 1)
              text = text.replace(scope_old, scope_new, 1)
              if old_note in text:
                  text = text.replace(old_note, new_note, 1)
              elif new_note not in text:
                  raise SystemExit(f'Decision #{n} reconciliation note missing')
              return text

          d10 = reconcile_addendum(
              d10,
              10,
              '**Scope:** Camera Decision #10 for Issue #2. This addendum extends the cumulative authority in `docs/22_GATE1_CAMERA_SPECIFICATION.md` until the next reconciliation pass folds it into that file.',
              '**Scope:** Camera Decision #10 provenance record for Issue #2. The cumulative implementation-facing authority now lives in `docs/22_GATE1_CAMERA_SPECIFICATION.md`; this file preserves the decision-specific owner-approved record.',
              """## Reconciliation note
`docs/22_GATE1_CAMERA_SPECIFICATION.md` currently contains Decisions #1–#9. This file is canonical authority for Decision #10 until the next reconciliation pass folds this section into `docs/22` and marks item #10 locked there. Do that reconciliation **before** treating Camera Decision #11 as repository-final.""",
              """## Reconciliation note
Decision #10 has been folded into `docs/22_GATE1_CAMERA_SPECIFICATION.md`. `docs/22` is the cumulative implementation-facing camera authority; this addendum remains the owner-approved decision-specific provenance record.""",
          )
          d10_path.write_text(d10)

          d11 = reconcile_addendum(
              d11,
              11,
              '**Scope:** Camera Decision #11 for Issue #2. This addendum extends the cumulative authority in `docs/22_GATE1_CAMERA_SPECIFICATION.md` until the next reconciliation pass folds it into that file.',
              '**Scope:** Camera Decision #11 provenance record for Issue #2. The cumulative implementation-facing authority now lives in `docs/22_GATE1_CAMERA_SPECIFICATION.md`; this file preserves the decision-specific owner-approved record.',
              """## Reconciliation note
`docs/22_GATE1_CAMERA_SPECIFICATION.md` currently contains Decisions #1–#9; Decision #10 is canonical in `docs/26_GATE1_CAMERA_LOCK_ACQUISITION_ADDENDUM.md`. This file is canonical authority for Decision #11 until the next reconciliation pass folds Decisions #10 and #11 into cumulative `docs/22` in order and marks them locked there. Perform that reconciliation before treating Camera Decision #12 as repository-final.""",
              """## Reconciliation note
Decisions #10 and #11 have been folded into `docs/22_GATE1_CAMERA_SPECIFICATION.md` in order. `docs/22` is the cumulative implementation-facing camera authority; this addendum remains the owner-approved decision-specific provenance record.""",
          )
          d11_path.write_text(d11)
          PY

      - name: Commit reconciliation
        shell: bash
        run: |
          git config user.name "ShiroMaō Studios Automation"
          git config user.email "42227255+raiinman@users.noreply.github.com"
          git add docs/22_GATE1_CAMERA_SPECIFICATION.md docs/26_GATE1_CAMERA_LOCK_ACQUISITION_ADDENDUM.md docs/27_GATE1_CAMERA_LOCK_FRAMING_ADDENDUM.md
          if git diff --cached --quiet; then
            echo "No reconciliation changes needed"
            exit 0
          fi
          git commit -m "Docs: reconcile approved lock-on camera decisions"
          git push origin HEAD:docs/reconcile-camera-locks
